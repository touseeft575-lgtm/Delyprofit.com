<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DailyProfit Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#06152b;
color:white;
padding:15px;
padding-bottom:100px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:30px;
font-weight:bold;
}

.logout-btn{
background:#ffcc00;
border:none;
padding:12px 20px;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.stats-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:20px;
}

.stat-box{
background:#152238;
padding:20px;
border-radius:25px;
text-align:center;
}

.balance-card{
background:#152238;
padding:30px;
border-radius:30px;
text-align:center;
margin-bottom:20px;
}

.balance-title{
font-size:22px;
margin-bottom:10px;
}

.balance{
font-size:65px;
font-weight:bold;
color:#ffcc00;
}

.action-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:20px;
}

.action-card{
background:#152238;
padding:35px 20px;
border-radius:25px;
text-align:center;
cursor:pointer;
}

.action-card i{
font-size:45px;
color:#ffcc00;
margin-bottom:15px;
}

.action-card div{
font-size:22px;
}

.section-title{
font-size:28px;
font-weight:bold;
margin:25px 0 15px;
}

.plan-card{
background:#152238;
padding:25px;
border-radius:25px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.activate-btn{
background:#ffcc00;
border:none;
padding:15px 25px;
border-radius:15px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.notice{
background:#152238;
padding:15px;
border-radius:15px;
margin-bottom:10px;
}

.modal{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#152238;
padding:25px;
border-radius:25px;
width:90%;
max-width:400px;
z-index:1000;
}

.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
z-index:999;
}

input,select{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:12px;
background:#081225;
color:white;
font-size:16px;
}

.btn{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:#00d2ff;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#152238;
display:flex;
justify-content:space-around;
padding:15px 0;
}

.nav-item{
text-align:center;
font-size:14px;
color:white;
}

.nav-item i{
display:block;
font-size:24px;
margin-bottom:5px;
}

a{
text-decoration:none;
color:white;
}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">
DailyProfit
</div>

<button class="logout-btn"
onclick="logoutUser()">
Logout
</button>

</div>

<div class="stats-grid">

<div class="stat-box"
style="border:2px solid #00ff66;">

<div>Aaj Ka Profit</div>

<h2 style="color:#00ff66;font-size:45px;">
Rs. <span id="todayProfit">0</span>
</h2>

</div>

<div class="stat-box"
style="border:2px solid #ffcc00;">

<div>Total Profit</div>

<h2 style="color:#ffcc00;font-size:45px;">
Rs. <span id="totalProfit">0</span>
</h2>

</div>

</div>

<div class="balance-card">

<div class="balance-title">
Total Balance
</div>

<div class="balance">
Rs. <span id="balance">0</span>
</div>

</div>

<div class="action-grid">

<div class="action-card"
onclick="showModal('depositModal')">

<i class="fas fa-university"></i>

<div>Deposit</div>

</div>

<div class="action-card"
onclick="showModal('withdrawModal')">

<i class="fas fa-wallet"></i>

<div>Withdraw</div>

</div>

</div>

<div class="action-grid">

<div class="action-card"
onclick="dailyCheckin()">

<i class="fas fa-calendar-check"></i>

<div>Daily Check-In</div>

</div>

<div class="action-card"
onclick="spinWheel()">

<i class="fas fa-gift"></i>

<div>Spin Wheel</div>

</div>

</div>

<div class="section-title">
VIP Plans
</div>

<div id="plans"></div>

<div class="section-title">
Notifications
</div>

<div id="notifications"></div>

<div id="overlay"
class="overlay"
onclick="closeAll()">
</div>

<!-- Deposit Modal -->

<div id="depositModal"
class="modal">

<h2>Deposit</h2>

<p style="margin-top:15px;">
EasyPaisa Number
</p>

<h2 style="color:#ffcc00;">
03404146445
</h2>

<p>
Name: Mohammed Tauseef Ahmed
</p>

<input type="number"
id="depAmount"
placeholder="Enter Amount">

<input type="text"
id="depTid"
placeholder="Transaction ID">

<input type="file"
id="screenshot">

<button class="btn"
onclick="submitDeposit()">

Submit Deposit

</button>

</div>

<!-- Withdraw Modal -->

<div id="withdrawModal"
class="modal">

<h2>Withdraw</h2>

<select id="withdrawMethod">

<option>EasyPaisa</option>
<option>JazzCash</option>

</select>

<input type="text"
id="withdrawNumber"
placeholder="Phone Number">

<input type="number"
id="withdrawAmount"
placeholder="Amount">

<button class="btn"
onclick="submitWithdraw()">

Withdraw

</button>

</div>

<!-- Navbar -->

<div class="navbar">

<div class="nav-item">

<i class="fas fa-home"></i>

Home

</div>

<a href="https://wa.me/923297179402">

<div class="nav-item">

<i class="fab fa-whatsapp"></i>

Support

</div>

</a>

</div>

<script type="module">

import { db, storage } from './firebase.js';

import {
doc,
onSnapshot,
updateDoc,
increment,
arrayUnion,
addDoc,
collection
}
from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

import {
ref,
uploadBytes,
getDownloadURL
}
from "https://www.gstatic.com/firebasejs/9.17.1/firebase-storage.js";

const uid = localStorage.getItem("uid");

if(!uid){
window.location = "login.html";
}

const userRef = doc(db,"users",uid);

const vipPlans = [

{name:"VIP1",amount:500,daily:120},
{name:"VIP2",amount:1000,daily:240},
{name:"VIP3",amount:2000,daily:480},
{name:"VIP4",amount:5000,daily:1200}

];

const plansDiv =
document.getElementById("plans");

vipPlans.forEach(plan=>{

plansDiv.innerHTML += `

<div class="plan-card">

<div>

<h2>${plan.name}</h2>

<p>
Invest Rs.${plan.amount}
</p>

<p>
Daily Rs.${plan.daily}
</p>

</div>

<button class="activate-btn"
onclick="activatePlan(${plan.amount})">

Activate

</button>

</div>

`;

});

onSnapshot(userRef,(snap)=>{

if(snap.exists()){

const d = snap.data();

document.getElementById("balance").innerText =
d.balance || 0;

document.getElementById("todayProfit").innerText =
d.todayProfit || 0;

document.getElementById("totalProfit").innerText =
d.totalProfit || 0;

if(d.notifications){

document.getElementById("notifications").innerHTML =

d.notifications.map(n=>`

<div class="notice">

${n.message}

</div>

`).join('');

}

}

});

window.showModal = function(id){

document.getElementById(id).style.display = "block";

document.getElementById("overlay").style.display = "block";

}

window.closeAll = function(){

document.querySelectorAll(".modal").forEach(m=>{

m.style.display = "none";

});

document.getElementById("overlay").style.display = "none";

}

window.logoutUser = function(){

localStorage.removeItem("uid");

window.location = "login.html";

}

window.activatePlan = async function(amount){

const balance =
parseInt(document.getElementById("balance").innerText);

if(balance < amount){

alert("Insufficient Balance");

return;

}

await updateDoc(userRef,{

balance: increment(-amount)

});

alert("VIP Activated");

}

window.dailyCheckin = async function(){

await updateDoc(userRef,{

balance: increment(20),
todayProfit: increment(20),
totalProfit: increment(20)

});

alert("Rs.20 Added");

}

window.spinWheel = async function(){

const rewards = [0,10,50,100];

const reward =
rewards[Math.floor(Math.random()*rewards.length)];

if(reward == 0){

alert("Better Luck Next Time");

}else{

await updateDoc(userRef,{

balance: increment(reward)

});

alert("You Won Rs."+reward);

}

}

window.submitDeposit = async function(){

const amount =
document.getElementById("depAmount").value;

const tid =
document.getElementById("depTid").value;

const file =
document.getElementById("screenshot").files[0];

if(!amount || !tid || !file){

alert("Fill All Fields");

return;

}

const storageRef =
ref(storage,"deposits/"+Date.now());

await uploadBytes(storageRef,file);

const imageUrl =
await getDownloadURL(storageRef);

await addDoc(collection(db,"depositRequests"),{

uid,
amount,
tid,
screenshot:imageUrl,
status:"Pending",
createdAt:new Date()

});

alert("Deposit Submitted");

closeAll();

}

window.submitWithdraw = async function(){

const method =
document.getElementById("withdrawMethod").value;

const number =
document.getElementById("withdrawNumber").value;

const amount =
document.getElementById("withdrawAmount").value;

await addDoc(collection(db,"withdrawRequests"),{

uid,
method,
number,
amount,
status:"Pending",
createdAt:new Date()

});

alert("Withdraw Submitted");

closeAll();

}

</script>

</body>
</html>
