<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#081225;
color:white;
padding:15px;
padding-bottom:100px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.balance-card{
background:#152238;
padding:30px;
border-radius:25px;
text-align:center;
margin-bottom:20px;
}

.balance{
font-size:55px;
font-weight:bold;
color:#ffcc00;
}

.action-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:20px;
}

.action-card{
background:#152238;
padding:25px;
border-radius:20px;
text-align:center;
}

.action-card i{
font-size:35px;
color:#ffcc00;
margin-bottom:10px;
}

.plan-card{
background:#152238;
padding:20px;
border-radius:20px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.btn{
background:#ffcc00;
color:black;
padding:12px 20px;
border:none;
border-radius:10px;
font-weight:bold;
}

.notice{
background:#152238;
padding:15px;
border-radius:15px;
margin-bottom:10px;
}

.section-title{
font-size:24px;
font-weight:bold;
margin:20px 0;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#152238;
display:flex;
justify-content:space-around;
padding:12px 0;
}

.nav-item{
text-align:center;
font-size:12px;
}

.nav-item i{
display:block;
font-size:22px;
margin-bottom:5px;
}
</style>
</head>

<body>

<div class="topbar">
<h1>DailyProfit</h1>
<button class="btn" onclick="logoutUser()">Logout</button>
</div>

<div class="balance-card">
<div>Total Balance</div>
<div class="balance">Rs. <span id="balance">0</span></div>
</div>

<div class="action-grid">

<div class="action-card" onclick="dailyCheckin()">
<i class="fas fa-calendar-check"></i>
<div>Daily Check-In</div>
</div>

<div class="action-card" onclick="spinWheel()">
<i class="fas fa-gift"></i>
<div>Spin Wheel</div>
</div>

</div>

<div class="section-title">VIP Plans</div>

<div id="plans"></div>

<div class="section-title">Notifications</div>

<div id="notifications"></div>

<div class="navbar">
<div class="nav-item">
<i class="fas fa-home"></i>
Home
</div>

<a href="https://wa.me/923297179402" style="text-decoration:none;color:white;">
<div class="nav-item">
<i class="fab fa-whatsapp"></i>
Support
</div>
</a>
</div>

<script type="module">

import { db } from './firebase.js';

import {
doc,
onSnapshot,
updateDoc,
increment,
arrayUnion
} from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

const uid = localStorage.getItem("uid");

if(!uid){
window.location = "login.html";
}

const userRef = doc(db,"users",uid);

const plans = [
{name:"VIP1",amount:500,daily:120},
{name:"VIP2",amount:1000,daily:240},
{name:"VIP3",amount:2000,daily:480},
{name:"VIP4",amount:5000,daily:1200}
];

const plansDiv = document.getElementById("plans");

plans.forEach(plan=>{

plansDiv.innerHTML += `
<div class="plan-card">
<div>
<h3>${plan.name}</h3>
<p>Invest Rs.${plan.amount}</p>
<p>Daily Rs.${plan.daily}</p>
</div>

<button class="btn" onclick="activatePlan('${plan.name}',${plan.amount},${plan.daily})">
Activate
</button>
</div>
`;

});

onSnapshot(userRef,(snap)=>{

if(snap.exists()){

const data = snap.data();

document.getElementById("balance").innerText = data.balance || 0;

if(data.notifications){

const html = data.notifications.map(n=>`
<div class="notice">${n.message}</div>
`).join('');

document.getElementById("notifications").innerHTML = html;

}

}

});

window.activatePlan = async (name,amount,daily)=>{

const balance = parseInt(document.getElementById("balance").innerText);

if(balance < amount){
alert("Insufficient Balance");
return;
}

await updateDoc(userRef,{
balance: increment(-amount),
activePlans: arrayUnion({
name,
amount,
daily,
startDate:new Date().toISOString()
})
});

alert(name + " Activated Successfully");

}

window.dailyCheckin = async ()=>{

await updateDoc(userRef,{
balance: increment(20),
todayProfit: increment(20),
totalProfit: increment(20)
});

alert("Rs 20 Added");

}

window.spinWheel = async ()=>{

const rewards = [0,10,50,100];

const reward = rewards[Math.floor(Math.random()*rewards.length)];

if(reward === 0){
alert("Better Luck Next Time");
}else{

await updateDoc(userRef,{
balance: increment(reward)
});

alert("You Won Rs " + reward);

}

}

window.logoutUser = ()=>{
localStorage.removeItem("uid");
window.location = "login.html";
}

</script>

</body>
</html>
