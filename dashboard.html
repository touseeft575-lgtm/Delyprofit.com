<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DailyProfit Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
body{
background:var(--bg);
font-family:Arial;
color:white;
padding:15px;
padding-bottom:100px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logout-btn{
background:var(--gold);
color:black;
padding:12px 22px;
border-radius:15px;
font-weight:bold;
border:none;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:18px;
}

.box{
background:#102447;
padding:18px;
border-radius:18px;
text-align:center;
}

.green{
border:2px solid #00ff66;
}

.yellow{
border:2px solid var(--gold);
}

.box h2{
font-size:20px;
margin-top:10px;
}

.balance-card{
background:#102447;
padding:35px 20px;
border-radius:25px;
text-align:center;
margin-bottom:20px;
}

.balance-card h1{
font-size:65px;
color:var(--gold);
margin-top:10px;
}

.action-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:20px;
}

.action-card{
background:#102447;
padding:35px 15px;
border-radius:25px;
text-align:center;
}

.action-card i{
font-size:40px;
color:var(--gold);
margin-bottom:12px;
}

.action-card div{
font-size:18px;
}

.section-title{
font-size:30px;
font-weight:bold;
margin:25px 0 15px;
}

.plan-card{
background:#102447;
padding:20px;
border-radius:20px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.plan-card h3{
color:#00d2ff;
margin-bottom:8px;
}

.btn{
background:#00d2ff;
color:black;
padding:12px 22px;
border:none;
border-radius:15px;
font-weight:bold;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#102447;
display:flex;
justify-content:space-around;
align-items:center;
padding:10px 0;
z-index:100;
}

.nav-item{
text-align:center;
font-size:13px;
color:white;
}

.nav-item i{
display:block;
font-size:22px;
margin-bottom:5px;
}

.center-btn{
background:linear-gradient(135deg,#ffcc00,#ff9900);
width:65px;
height:65px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
margin-top:-35px;
box-shadow:0 0 20px rgba(255,204,0,0.6);
}

.center-btn i{
font-size:28px;
color:black;
}

.modal{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:92%;
max-width:450px;
background:#102447;
padding:20px;
border-radius:20px;
z-index:999;
max-height:90vh;
overflow:auto;
}

.overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
z-index:998;
}

input,select{
width:100%;
padding:13px;
margin-top:12px;
background:#03132c;
color:white;
border:1px solid #334155;
border-radius:12px;
}

.my-plan{
background:#102447;
padding:15px;
border-radius:18px;
margin-bottom:12px;
}

.timer{
color:#00ff66;
margin-top:8px;
font-size:14px;
}

.noti{
background:#102447;
padding:12px;
border-radius:15px;
margin-bottom:10px;
}
</style>
</head>
<body>

<div class="topbar">
<h1>DailyProfit</h1>
<button class="logout-btn" onclick="logoutUser()">Logout</button>
</div>

<div class="grid">
<div class="box green">
<div>Today Profit</div>
<h2>Rs. <span id="todayProfit">0</span></h2>
</div>

<div class="box yellow">
<div>Total Profit</div>
<h2>Rs. <span id="totalProfit">0</span></h2>
</div>
</div>

<div class="balance-card">
<div>Total Balance</div>
<h1>Rs. <span id="balance">0</span></h1>
</div>

<div class="action-grid">
<div class="action-card" onclick="showModal('depositModal')">
<i class="fas fa-building-columns"></i>
<div>Deposit</div>
</div>

<div class="action-card" onclick="showModal('withdrawModal')">
<i class="fas fa-wallet"></i>
<div>Withdraw</div>
</div>
</div>

<div class="action-grid">
<div class="action-card" onclick="dailyCheckin()">
<i class="fas fa-calendar-check"></i>
<div>Daily Check-In</div>
</div>

<div class="action-card" onclick="spinWheel()">
<i class="fas fa-gift"></i>
<div>Spin Wheel</div>
</div>
</div>

<div class="section-title">VIP Plans</div>
<div id="plans"></div>

<div class="section-title">Notifications</div>
<div id="notifications"></div>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<div class="modal" id="depositModal">
<h2>Deposit</h2>
<select id="depositMethod">
<option>EasyPaisa</option>
<option>JazzCash</option>
</select>
<input type="number" id="depositAmount" placeholder="Enter Amount">
<input type="text" id="depositNumber" placeholder="Enter Your Wallet Number">
<button class="btn" style="width:100%;margin-top:15px;" onclick="submitDeposit()">Submit Deposit</button>
</div>

<div class="modal" id="withdrawModal">
<h2>Withdraw</h2>
<select id="withdrawMethod">
<option>EasyPaisa</option>
<option>JazzCash</option>
</select>
<input type="text" id="withdrawNumber" placeholder="Wallet Number">
<input type="number" id="withdrawAmount" placeholder="Amount">
<button class="btn" style="width:100%;margin-top:15px;" onclick="submitWithdraw()">Withdraw</button>
</div>

<div class="modal" id="myPlansModal">
<h2 style="margin-bottom:20px;">My Active Plans</h2>
<div id="myPlansContainer"></div>
</div>

<nav class="navbar">
<div class="nav-item">
<i class="fas fa-home"></i>
Home
</div>

<div class="nav-item">
<i class="fas fa-clock-rotate-left"></i>
History
</div>

<div class="center-btn" onclick="showModal('myPlansModal')">
<i class="fas fa-plane"></i>
</div>

<div class="nav-item">
<i class="fas fa-users"></i>
Team
</div>

<div class="nav-item">
<i class="fab fa-whatsapp"></i>
Support
</div>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";

import {
getFirestore,
doc,
onSnapshot,
updateDoc,
arrayUnion,
increment,
addDoc,
collection,
getDoc
} from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_STORAGE_BUCKET",
messagingSenderId: "YOUR_MSG_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const currentUID = localStorage.getItem("uid");
const userRef = doc(db,"users",currentUID);

const plans = [
{name:"VIP1",amount:500,daily:120,days:60},
{name:"VIP2",amount:1000,daily:240,days:60},
{name:"VIP3",amount:2000,daily:480,days:60},
{name:"VIP4",amount:5000,daily:1200,days:60},
{name:"VIP5",amount:10000,daily:2500,days:60},
{name:"VIP6",amount:20000,daily:5200,days:60}
];

const plansDiv = document.getElementById('plans');

plansDiv.innerHTML = plans.map(p=>`
<div class="plan-card">
<div>
<h3>${p.name}</h3>
<p>Invest Rs ${p.amount}</p>
<p>Daily Profit Rs ${p.daily}</p>
<p>${p.days} Days</p>
</div>
<button class="btn" onclick="activatePlan('${p.name}',${p.amount},${p.daily},${p.days})">Activate</button>
</div>
`).join('');

window.showModal=(id)=>{
document.getElementById(id).style.display='block';
document.getElementById('overlay').style.display='block';
}

window.closeAll=()=>{
document.querySelectorAll('.modal').forEach(m=>m.style.display='none');
document.getElementById('overlay').style.display='none';
}

window.logoutUser=()=>{
localStorage.clear();
window.location.href='login.html';
}

window.activatePlan = async(name,amount,daily,days)=>{
const snap = await getDoc(userRef);
const data = snap.data();

if(data.balance < amount){
alert('Insufficient Balance');
return;
}

const now = Date.now();

const newPlan = {
name,
amount,
daily,
days,
startTime: now,
lastProfitTime: now,
expiryTime: now + (days*24*60*60*1000)
};

await updateDoc(userRef,{
balance: increment(-amount),
activePlans: arrayUnion(newPlan),
notifications: arrayUnion({
message:`${name} Activated Successfully`,
time:new Date().toISOString()
})
});

alert('Plan Activated');
}

async function autoDailyProfit(userData){
if(!userData.activePlans) return;

let totalAdd = 0;
let totalToday = userData.todayProfit || 0;
let totalProfit = userData.totalProfit || 0;
let updatedPlans = [];

const now = Date.now();

userData.activePlans.forEach(plan=>{

let last = plan.lastProfitTime || plan.startTime;

if(now >= plan.expiryTime){
return;
}

if(now - last >= 86400000){
const cycles = Math.floor((now - last)/86400000);
const addProfit = cycles * plan.daily;

plan.lastProfitTime = last + (cycles*86400000);

totalAdd += addProfit;
totalToday += addProfit;
totalProfit += addProfit;
}

updatedPlans.push(plan);
});

if(totalAdd > 0){
await updateDoc(userRef,{
balance: increment(totalAdd),
todayProfit: totalToday,
totalProfit: totalProfit,
activePlans: updatedPlans,
notifications: arrayUnion({
message:`Daily Profit Added Rs ${totalAdd}`,
time:new Date().toISOString()
})
});
}
}

onSnapshot(userRef, async(snap)=>{
if(snap.exists()){
const d = snap.data();

await autoDailyProfit(d);

document.getElementById('balance').innerText = d.balance || 0;
document.getElementById('todayProfit').innerText = d.todayProfit || 0;
document.getElementById('totalProfit').innerText = d.totalProfit || 0;

if(d.notifications){
document.getElementById('notifications').innerHTML = d.notifications.reverse().map(n=>`
<div class="noti">
${n.message}
</div>
`).join('');
}

loadMyPlans(d.activePlans || []);
}
});

function loadMyPlans(activePlans){
const container = document.getElementById('myPlansContainer');

if(activePlans.length===0){
container.innerHTML='<p>No Active Plans</p>';
return;
}

container.innerHTML = activePlans.map((p,index)=>{
const remain = p.expiryTime - Date.now();
const days = Math.floor(remain / (1000*60*60*24));
const hours = Math.floor((remain % (1000*60*60*24))/(1000*60*60));

return `
<div class="my-plan">
<h3>${p.name}</h3>
<p>Invested: Rs ${p.amount}</p>
<p>Daily Income: Rs ${p.daily}</p>
<div class="timer">Expiry In ${days} Days ${hours} Hours</div>
</div>
`;
}).join('');
}

window.dailyCheckin = async()=>{
await updateDoc(userRef,{
balance: increment(20),
notifications: arrayUnion({
message:'Daily Check-In Reward Rs 20 Added',
time:new Date().toISOString()
})
});

alert('Rs 20 Added');
}

window.spinWheel = async()=>{
const rewards=[10,50,100,0];
const reward = rewards[Math.floor(Math.random()*rewards.length)];

if(reward===0){
alert('Better Luck Next Time');
}else{
await updateDoc(userRef,{
balance: increment(reward)
});

alert(`You Won Rs ${reward}`);
}
}

window.submitDeposit = async()=>{
const method=document.getElementById('depositMethod').value;
const amount=document.getElementById('depositAmount').value;
const number=document.getElementById('depositNumber').value;

await addDoc(collection(db,'depositRequests'),{
uid:currentUID,
method,
amount,
number,
status:'Pending',
createdAt:new Date()
});

alert('Deposit Request Submitted');
closeAll();
}

window.submitWithdraw = async()=>{
const method=document.getElementById('withdrawMethod').value;
const number=document.getElementById('withdrawNumber').value;
const amount=document.getElementById('withdrawAmount').value;

await addDoc(collection(db,'withdrawRequests'),{
uid:currentUID,
method,
number,
amount,
status:'Pending',
createdAt:new Date()
});

alert('Withdraw Request Submitted');
closeAll();
}
</script>
</body>
</html>
