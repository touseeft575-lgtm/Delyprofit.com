<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - DailyProfit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #ffcc00;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-white: #f8fafc;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark-bg); color: var(--text-white); margin: 0; padding: 20px; }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .back-btn { color: var(--primary-gold); font-size: 20px; text-decoration: none; }
        .history-card { background: var(--card-bg); padding: 15px; border-radius: 15px; margin-bottom: 12px; border-left: 4px solid var(--primary-gold); position: relative; }
        .status-badge { position: absolute; top: 15px; right: 15px; font-size: 11px; padding: 4px 8px; border-radius: 6px; background: #334155; color: var(--primary-gold); }
        .type-label { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
        .date-label { font-size: 12px; color: #94a3b8; }
        .amount-label { color: var(--primary-gold); font-weight: bold; margin-top: 8px; font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <h2 style="margin: 0;">Transaction History</h2>
    </div>

    <div id="historyList">
        <div style="text-align: center; margin-top: 50px; color: #94a3b8;">
            <i class="fas fa-spinner fa-spin" style="font-size: 30px; margin-bottom: 10px;"></i>
            <p>Loading your transactions...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlygZa2EDyHBuCT8RTZENicnvYW-D-67g",
            authDomain: "dailyprofit-b9600.firebaseapp.com",
            projectId: "dailyprofit-b9600",
            storageBucket: "dailyprofit-b9600.appspot.com",
            messagingSenderId: "879891413676",
            appId: "1:879891413676:web:bfba99ee5b95c45b957d09",
            measurementId: "G-T5FJ81FP62"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const q = query(collection(db, "requests"), where("uid", "==", user.uid));
                onSnapshot(q, (snapshot) => {
                    let html = "";
                    if (snapshot.empty) {
                        html = "<p style='text-align:center; color:#94a3b8;'>No transactions found.</p>";
                    } else {
                        snapshot.forEach(doc => {
                            const data = doc.data();
                            html += `
                                <div class="history-card">
                                    <span class="status-badge">${data.status || 'Pending'}</span>
                                    <div class="type-label">${data.type || 'Deposit'}</div>
                                    <div class="date-label">${data.time || 'N/A'}</div>
                                    <div class="amount-label">Rs. ${data.amount}</div>
                                </div>
                            `;
                        });
                    }
                    document.getElementById("historyList").innerHTML = html;
                });
            } else {
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
