<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DailyProfit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-gold: #ffcc00; --dark-bg: #0f172a; --card-bg: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: white; margin: 0; padding: 15px; }
        .balance-card { background: linear-gradient(135deg, #1e293b, #334155); padding: 25px; border-radius: 20px; border: 1px solid var(--primary-gold); text-align: center; margin-bottom: 20px; }
        .balance-amount { font-size: 32px; font-weight: bold; color: var(--primary-gold); margin: 10px 0; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .action-btn { background: var(--card-bg); padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; border: 1px solid #334155; }
        .action-btn i { font-size: 24px; color: var(--primary-gold); margin-bottom: 10px; }
        .menu-bar { display: flex; justify-content: space-around; background: var(--card-bg); padding: 15px; position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid #334155; }
        .menu-item { color: #94a3b8; text-decoration: none; font-size: 12px; text-align: center; }
        .menu-item.active { color: var(--primary-gold); }
    </style>
</head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3>DailyProfit</h3>
        <a href="history.html" style="color: var(--primary-gold); text-decoration: none;"><i class="fas fa-user-circle fa-2x"></i></a>
    </div>

    <div class="balance-card">
        <div style="font-size: 14px; color: #94a3b8;">Total Balance</div>
        <div class="balance-amount">Rs. <span id="balance">0.00</span></div>
        <div style="display: flex; justify-content: space-around; margin-top: 15px;">
            <div><small>Daily Profit</small><br><b id="profit">Rs. 0</b></div>
            <div><small>Withdraw</small><br><b id="withdraw">Rs. 0</b></div>
        </div>
    </div>

    <div class="action-grid">
        <div class="action-btn" onclick="alert('Deposit page opening...')">
            <i class="fas fa-university"></i><br>Deposit
        </div>
        <div class="action-btn" onclick="alert('Withdraw page opening...')">
            <i class="fas fa-wallet"></i><br>Withdraw
        </div>
    </div>

    <div class="menu-bar">
        <a href="#" class="menu-item active"><i class="fas fa-home"></i><br>Home</a>
        <a href="history.html" class="menu-item"><i class="fas fa-history"></i><br>History</a>
        <a href="login.html" class="menu-item"><i class="fas fa-sign-out-alt"></i><br>Logout</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
             apiKey: "AIzaSyBLygZa2EDyHBuCT8RTZEMIcnvYW-D-67g",
    authDomain: "dailyprofit-b9600.firebaseapp.com",
    projectId: "dailyprofit-b9600",
    storageBucket: "dailyprofit-b9600.firebasestorage.app",
    messagingSenderId: "879891413676",
    appId: "1:879891413676:web:bfba99ee5b95c45b957d09",
    measurementId: "G-T5FJ81FP62"

        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (doc) => {
                    if (doc.exists()) {
                        const data = doc.data();
                        document.getElementById("balance").innerText = data.balance;
                        document.getElementById("profit").innerText = "Rs. " + data.dailyProfit;
                        document.getElementById("withdraw").innerText = "Rs. " + data.totalWithdraw;
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
