<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DailyProfit Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#081225;
color:white;
padding:15px;
padding-bottom:100px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.topbar h1{
font-size:32px;
}

.stats-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:20px;
}

.stat-box{
background:#152238;
padding:20px;
border-radius:20px;
text-align:center;
}

.balance-card{
background:linear-gradient(135deg,#14213d,#0f172a);
padding:30px;
border-radius:25px;
text-align:center;
margin-bottom:20px;
}

.balance{
font-size:55px;
font-weight:bold;
color:#ffcc00;
}

.action-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:20px;
}

.action-card{
background:#152238;
padding:25px;
border-radius:20px;
text-align:center;
cursor:pointer;
}

.action-card i{
font-size:35px;
color:#ffcc00;
margin-bottom:10px;
}

.section-title{
font-size:24px;
font-weight:bold;
margin:20px 0;
border-left:5px solid #ffcc00;
padding-left:10px;
}

.plan-card{
background:#152238;
padding:20px;
border-radius:20px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid #223555;
}

.btn{
background:#00d2ff;
color:black;
padding:12px 18px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.notice{
background:#152238;
padding:15px;
border-radius:15px;
margin-bottom:10px;
}

.modal{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#152238;
padding:20px;
border-radius:20px;
width:90%;
max-width:400px;
z-index:1000;
}

.overlay{
display:none;
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
top:0;
left:0;
z-index:999;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

.navbar{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#152238;
display:flex;
justify-content:space-around;
padding:12px 0;
}

.nav-item{
text-align:center;
color:#b8c2d1;
font-size:12px;
cursor:pointer;
}

.nav-item i{
display:block;
font-size:22px;
margin-bottom:4px;
}

a{
text-decoration:none;
color:white;
}

</style>

</head>

<body>

<div class="topbar">

<h1>DailyProfit</h1>

<div style="display:flex;gap:10px;align-items:center;">

<!-- SUPPORT BUTTON -->
<button onclick="openSupport()"
style="
background:#25D366;
border:none;
padding:10px 14px;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
">
Support
</button>

<!-- LOGOUT BUTTON -->
<button onclick="logoutUser()"
style="
background:red;
border:none;
padding:10px 14px;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
">
Logout
</button>

</div>

</div>
  
</div>

<div class="stats-grid">

<div class="stat-box"
style="border:2px solid #00ff66;">

<div>Aaj Ka Profit</div>

<h2 style="color:#00ff66;">
Rs. <span id="todayProfit">0</span>
</h2>

</div>

<div class="stat-box"
style="border:2px solid #ffcc00;">

<div>Total Profit</div>

<h2 style="color:#ffcc00;">
Rs. <span id="totalProfit">0</span>
</h2>

</div>

</div>

<div class="balance-card">

<div>Total Balance</div>

<div class="balance">
Rs. <span id="balance">0</span>
</div>

</div>

<div class="action-grid">

<div class="action-card"
onclick="showModal('depositModal')">

<i class="fas fa-university"></i>

<div>Deposit</div>

</div>

<div class="action-card"
onclick="showModal('withdrawModal')">

<i class="fas fa-wallet"></i>

<div>Withdraw</div>

</div>

</div>

<div class="action-grid">

<div class="action-card"
onclick="dailyCheckin()">

<i class="fas fa-calendar-check"></i>

<div>Daily Check-In</div>

</div>

<div class="action-card"
onclick="spinWheel()">

<i class="fas fa-gift"></i>

<div>Spin Wheel</div>

</div>

</div>

<div class="section-title">
VIP Plans
</div>

<div id="plans"></div>

<div class="section-title">
Notifications
</div>

<div id="notifications"></div>

<div id="overlay"
class="overlay"
onclick="closeAll()">
</div>

<!-- DEPOSIT MODAL -->

<div id="depositModal"
class="modal">

<h2>Deposit</h2>

<p>EasyPaisa: 03404146445</p>

<p>Name: Muhammad Touseef Ahmad</p>

<input type="number"
id="depAmount"
placeholder="Enter Amount">

<input type="text"
id="depTid"
placeholder="Transaction ID">

<input type="file"
id="screenshot">

<button class="btn"
onclick="submitDeposit()">

Submit Deposit

</button>

</div>

<!-- WITHDRAW MODAL -->

<div id="withdrawModal"
class="modal">

<h2>Withdraw</h2>

<select id="withdrawMethod">

<option>EasyPaisa</option>
<option>JazzCash</option>

</select>

<input type="text"
id="withdrawNumber"
placeholder="Phone Number">

<input type="number"
id="withdrawAmount"
placeholder="Amount">

<button class="btn"
onclick="submitWithdraw()">

Withdraw

</button>

</div>

<!-- NAVBAR -->

<div class="navbar">

<div class="nav-item">

<i class="fas fa-home"></i>

Home

</div>

<div class="nav-item"
onclick="openPlans()">

<i class="fas fa-layer-group"></i>

Plans

</div>

<div class="nav-item"
onclick="openHistory()">

<i class="fas fa-history"></i>

History

</div>

<a href="https://wa.me/923297179402">

<div class="nav-item">

<i class="fab fa-whatsapp"></i>

Support

</div>

</a>

</div>

<script type="module">

import { db, storage } from './firebase.js';

import {
doc,
onSnapshot,
updateDoc,
increment,
addDoc,
collection,
arrayUnion
}
from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

import {
ref,
uploadBytes,
getDownloadURL
}
from "https://www.gstatic.com/firebasejs/9.17.1/firebase-storage.js";

const uid = localStorage.getItem("uid");

if(!uid){

alert("Login First");

window.location = "login.html";

}

const userRef = doc(db,"users",uid);


// VIP PLANS

const vipPlans = [

{
name:"VIP1",
amount:500,
daily:120
},

{
name:"VIP2",
amount:1000,
daily:240
},

{
name:"VIP3",
amount:2000,
daily:480
},

{
name:"VIP4",
amount:5000,
daily:1200
},

{
name:"VIP5",
amount:10000,
daily:2500
},

{
name:"VIP6",
amount:20000,
daily:5000
}

];


// SHOW PLANS

const plansDiv = document.getElementById("plans");

plansDiv.innerHTML = "";

vipPlans.forEach(plan=>{

plansDiv.innerHTML += `

<div class="plan-card">

<div>

<h3 style="color:#00d2ff;">
${plan.name}
</h3>

<p>
Invest Rs.${plan.amount}
</p>

<p>
Daily Income Rs.${plan.daily}
</p>

</div>

<button class="btn"
onclick="activatePlan('${plan.name}',${plan.amount},${plan.daily})">

Activate

</button>

</div>

`;

});


// REALTIME USER DATA

onSnapshot(userRef,(snap)=>{

if(snap.exists()){

const d = snap.data();

document.getElementById("balance").innerText =
d.balance || 0;

document.getElementById("todayProfit").innerText =
d.todayProfit || 0;

document.getElementById("totalProfit").innerText =
d.totalProfit || 0;

if(d.notifications){

document.getElementById("notifications").innerHTML =

d.notifications.map(n=>`

<div class="notice">

${n.message}

</div>

`).join('');

}

}

});


// MODALS

window.showModal = function(id){

document.getElementById(id).style.display = "block";

document.getElementById("overlay").style.display = "block";

}
window.closeAll = function(){

document.querySelectorAll(".modal").forEach(modal=>{

modal.style.display = "none";

});

document.getElementById("overlay").style.display = "none";

}


// SUPPORT BUTTON
window.openSupport = function(){

window.open(
"https://wa.me/923297179402",
"_blank"
);

}


// LOGOUT BUTTON
window.logoutUser = function(){

localStorage.removeItem("loggedIn");

alert("Logged Out Successfully");

window.location.href = "login.html";

}

  

// ACTIVATE PLAN

window.activatePlan = async function(name, amount, daily){

const balance =
parseInt(document.getElementById("balance").innerText) || 0;

if(balance < amount){

alert("Insufficient Balance");

return;

}

await updateDoc(userRef,{

balance: increment(-amount),

activePlans: arrayUnion({

name:name,
amount:amount,
daily:daily,
date:new Date()

})

});

alert(name + " Activated Successfully");

}


// DAILY CHECKIN

window.dailyCheckin = async function(){

await updateDoc(userRef,{

balance: increment(20),
todayProfit: increment(20),
totalProfit: increment(20)

});

alert("Rs.20 Added");

}


// SPIN WHEEL

window.spinWheel = async function(){

const rewards = [0,10,50,100];

const reward =
rewards[Math.floor(Math.random()*rewards.length)];

if(reward == 0){

alert("Better Luck Next Time");

}else{

await updateDoc(userRef,{

balance: increment(reward)

});

alert("You Won Rs."+reward);

}

}


// DEPOSIT

window.submitDeposit = async function(){

const amount =
document.getElementById("depAmount").value;

const tid =
document.getElementById("depTid").value;

const file =
document.getElementById("screenshot").files[0];

if(!amount || !tid || !file){

alert("Fill All Fields");

return;

}

const storageRef =
ref(storage,"deposits/"+Date.now());

await uploadBytes(storageRef,file);

const imageUrl =
await getDownloadURL(storageRef);

await addDoc(collection(db,"depositRequests"),{

uid,
amount,
tid,
screenshot:imageUrl,
status:"Pending",
createdAt:new Date()

});

alert("Deposit Submitted");

closeAll();

}


// WITHDRAW

window.submitWithdraw = async function(){

const method =
document.getElementById("withdrawMethod").value;

const number =
document.getElementById("withdrawNumber").value;

const amount =
document.getElementById("withdrawAmount").value;

await addDoc(collection(db,"withdrawRequests"),{

uid,
method,
number,
amount,
status:"Pending",
createdAt:new Date()

});

alert("Withdraw Submitted");

closeAll();

}


// HISTORY

window.openHistory = function(){

alert("History Feature Added");

}


// OPEN PLANS

window.openPlans = function(){

window.scrollTo({

top:document.getElementById("plans").offsetTop,
behavior:"smooth"

});

}

</script>

</body>
</html>
