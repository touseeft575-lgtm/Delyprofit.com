<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyProfit - Smart Investment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #ffcc00;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --text-white: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-white);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navbar Design */
        .navbar {
            width: 100%;
            padding: 20px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-gold);
            margin-left: 20px;
        }

        /* Main Dashboard Container */
        .container {
            width: 90%;
            max-width: 500px;
            margin-top: 30px;
        }

        /* Balance Card Design */
        .balance-card {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 204, 0, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

        .balance-label {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-balance {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary-gold);
            margin: 10px 0;
        }

        /* Stats Grid (Profit, Withdraw) */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border-bottom: 3px solid var(--primary-gold);
        }

        .stat-box i {
            color: var(--primary-gold);
            margin-bottom: 10px;
            font-size: 20px;
        }

        /* Buttons Section */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-deposit {
            background-color: var(--primary-gold);
            color: black;
        }

        .btn-withdraw {
            background-color: transparent;
            border: 2px solid var(--primary-gold);
            color: var(--primary-gold);
        }

        .btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        /* Plan Section */
        .plans-title {
            margin-top: 40px;
            font-size: 20px;
            border-left: 4px solid var(--primary-gold);
            padding-left: 10px;
        }

        .plan-card {
            background: #1e293b;
            margin-top: 15px;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-info h4 { margin: 0; color: var(--primary-gold); }
        .plan-info p { margin: 5px 0 0 0; font-size: 12px; color: #94a3b8; }

        .btn-invest {
            background: #059669;
            color: white;
            padding: 8px 15px;
            font-size: 13px;
        }

    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">DailyProfit</div>
        <i class="fas fa-user-circle" style="font-size: 24px; margin-right: 20px;"></i>
    </div>

    <div class="container">
        <div class="balance-card">
            <div class="balance-label">Total Available Balance</div>
            <div class="main-balance">Rs. <span id="userBalance">0.00</span></div>
            <p style="color: #22c55e; font-size: 13px;"><i class="fas fa-shield-alt"></i> Account Secured</p>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <i class="fas fa-chart-line"></i>
                <div class="balance-label">Daily Profit</div>
                <div style="font-weight: bold;">Rs. 0.00</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-wallet"></i>
                <div class="balance-label">Withdrawals</div>
                <div style="font-weight: bold;">Rs. 0.00</div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-deposit"><i class="fas fa-plus-circle"></i> Deposit Money</button>
            <button class="btn btn-withdraw"><i class="fas fa-arrow-down"></i> Withdraw Funds</button>
        </div>

        <h3 class="plans-title">Available Plans</h3>
        
        <div class="plan-card">
            <div class="plan-info">
                <h4>Basic Plan</h4>
                <p>Invest: 500 | Daily: 50 PKR</p>
            </div>
            <button class="btn btn-invest">Invest Now</button>
        </div>

        <div class="plan-card" style="margin-bottom: 50px;">
            <div class="plan-info">
                <h4>Premium Plan</h4>
                <p>Invest: 2000 | Daily: 250 PKR</p>
            </div>
            <button class="btn btn-invest">Invest Now</button>
        </div>
    </div>

    <script>
        // Yahan aapne wo code likhna hai jo Firebase se data layega
        // Maslan: db.collection("users").doc(userId).onSnapshot...
        // Main agle step mein aapko data connect karne ka code deta hoon.
    </script>
</body>
</html>
