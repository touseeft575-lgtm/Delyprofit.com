<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#081225;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.login-box{
width:100%;
max-width:400px;
background:#152238;
padding:25px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h1{
text-align:center;
margin-bottom:25px;
color:#ffcc00;
font-size:32px;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:12px;
background:#0f172a;
color:white;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#00d2ff;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.9;
}

.register-btn{
background:#ffcc00;
margin-top:15px;
}

</style>

</head>

<body>

<div class="login-box">

<h1>Login</h1>

<input type="email"
id="email"
placeholder="Enter Email">

<input type="password"
id="password"
placeholder="Enter Password">

<button onclick="loginUser()">

Login

</button>
<button class="register-btn"
onclick="window.location='signup.html'">
Register
</button>

  
</div>

<script type="module">

import { auth } from './firebase.js';

import {
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js";

window.loginUser = async function(){

const phone =
document.getElementById("email").value;

const email =
phone + "@gmail.com";

const password =
document.getElementById("password").value;

if(!email || !password){

alert("Fill All Fields");

return;

}

try{

const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);

localStorage.setItem(
"uid",
userCredential.user.uid
);

alert("Login Successful");

window.location = "index.html";

}catch(error){

alert(error.message);

}

}

</script>

</body>
</html>
